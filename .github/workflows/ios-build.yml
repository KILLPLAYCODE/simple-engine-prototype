name: iOS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Clone Axmol Engine
      run: |
        git clone --depth 1 https://github.com/axmolengine/axmol.git axmol

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Build Tools
      run: |
        brew install cmake ninja

    - name: Setup Axmol Engine
      run: |
        cd axmol
        python setup.py --force
        echo "$HOME/.axmol/bin" >> $GITHUB_PATH
        echo "/Users/runner/.axmol/bin" >> $GITHUB_PATH

    - name: Build iOS Application
      run: |
        axmol build -p ios -a arm64 -config Release

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-build-release
        path: build_ios_arm64/bin/Release/Simple_Engine.app
