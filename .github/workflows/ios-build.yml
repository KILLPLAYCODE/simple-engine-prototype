name: iOS Build

# Сборка будет запускаться автоматически при каждом пуше в ветку main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-ios:
    # Заставляем GitHub запустить виртуальную машину на macOS
    runs-on: macos-latest

    steps:
    # 1. Скачиваем ваш код из репозитория
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive # Важно, если внутри есть сабмодули

    # 2. Настраиваем Python (он нужен для утилит Axmol)
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-python-version: '3.10'

    # 3. Устанавливаем CMake и Ninja (инструменты сборки)
    - name: Install Build Tools
      run: |
        brew install cmake ninja

    # 4. Инициализируем и подготавливаем движок Axmol
    # (Движок сам скачает необходимые для сборки внутренние зависимости)
    - name: Setup Axmol Engine
      run: |
        python axmol/setup.py --force
        # Перезапускаем окружение, чтобы применились переменные путей
        source ~/.bash_profile || source ~/.zsh_profile

    # 5. Генерируем проект и запускаем компиляцию под iOS
    - name: Build iOS Application
      run: |
        # Команда сборки Axmol под архитектуру современных iPhone (arm64)
        # Флаг -config Release собирает оптимизированную финальную версию
        axmol build -p ios -a arm64 -config Release

    # 6. Сохраняем скомпилированный результат, чтобы вы могли его скачать
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-build-release
        # Указываем путь, куда Axmol складывает готовые бинарники. 
        # Подставьте имя вашего проекта вместо 'YourProjectName'
        path: build_ios_arm64/bin/Release/YourProjectName.app

