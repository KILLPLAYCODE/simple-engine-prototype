name: iOS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    # 1. Скачиваем вашу игру из вашего репозитория
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # 2. ОФИЦИАЛЬНЫЙ СПОСОБ: Скачиваем движок Axmol в папку 'engine'
    - name: Checkout Axmol Engine
      uses: actions/checkout@v4
      with:
        repository: axmolengine/axmol
        path: engine
        ref: dev # Скачиваем основную ветку разработки движка

    # 3. Настраиваем Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 4. Устанавливаем CMake и Ninja
    - name: Install Build Tools
      run: |
        brew install cmake ninja

    # 5. Инициализируем движок внутри его папки
    - name: Setup Axmol Engine
      run: |
        cd engine
        python setup.py --force
        # Записываем пути в специальный файл окружения GitHub Actions
        echo "/Users/runner/.axmol/bin" >> $GITHUB_PATH
        echo "$HOME/.axmol/bin" >> $GITHUB_PATH

    # 6. Компилируем игру под iOS
    - name: Build iOS Application
      run: |
        # Вызываем утилиту по абсолютному пути, чтобы избежать сбоев PATH
        $HOME/.axmol/bin/axmol build -p ios -a arm64 -config Release

    # 7. Архивация результата (Замените simple_prototype на имя вашей исполняемой папки)
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-build-release
        path: build_ios_arm64/bin/Release/simple_prototype.app
