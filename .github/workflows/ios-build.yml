name: iOS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Checkout Axmol Engine
      uses: actions/checkout@v4
      with:
        repository: axmolengine/axmol
        path: engine
        ref: release/2.x

    - name: Install Build Tools
      run: |
        brew install cmake ninja

    - name: Setup Axmol Engine
      run: |
        cd engine
        pwsh ./setup.ps1
        echo "/Users/runner/.axmol/bin" >> $GITHUB_PATH
        echo "$HOME/.axmol/bin" >> $GITHUB_PATH

    - name: Build iOS Application
      run: |
        cd engine
        pwsh -Command "axmol build -p ios -a arm64 -config Release -project-dir .."
        
        cd build_ios_arm64
        
        xcodebuild -project axmol.xcodeproj -scheme simple_prototype -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO clean build

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-build-release
        path: engine/build_ios_arm64/bin/Release/

