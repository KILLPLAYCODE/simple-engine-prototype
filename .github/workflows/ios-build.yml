name: iOS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Checkout Axmol Engine
      uses: actions/checkout@v4
      with:
        repository: axmolengine/axmol
        path: engine
        ref: release/2.x

    - name: Install Build Tools
      run: |
        brew install cmake ninja

    - name: Setup Axmol Engine
      run: |
        cd engine
        pwsh ./setup.ps1
        echo "AXMOL_ROOT=$GITHUB_WORKSPACE/engine" >> $GITHUB_ENV
        echo "$GITHUB_WORKSPACE/engine/bin" >> $GITHUB_PATH

    - name: Build iOS Application
      run: |
        $HOME/.axmol/bin/axmol build -p ios -a arm64 -config Release --engine-dir ./engine
        
        cd build_ios_arm64
        
        xcodebuild -project axmol.xcodeproj -scheme axmol -target simple_prototype -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO clean build


    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-build-release
        path: build_ios_arm64/

