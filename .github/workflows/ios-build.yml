name: iOS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Checkout Axmol Engine
      uses: actions/checkout@v4
      with:
        repository: axmolengine/axmol
        path: engine
        ref: dev

    - name: Install Build Tools
      run: |
        brew install cmake ninja

    - name: Setup Axmol Engine
      run: |
        cd engine
        pwsh ./setup.ps1
        echo "/Users/runner/.axmol/bin" >> $GITHUB_PATH
        echo "$HOME/.axmol/bin" >> $GITHUB_PATH

    - name: Build iOS Application
      run: |
        # Флаг -k (или --package) заставляет утилиту axmol автоматически упаковать .app в архив .ipa
        $HOME/.axmol/bin/axmol build -p ios -a arm64 -config Release -k

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-build-release
        path: build_ios_arm64/**/*.ipa
